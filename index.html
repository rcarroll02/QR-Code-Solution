<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR-Code-Solution
  </title>
  <link rel="stylesheet" href="style.css">
  <style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap');</style>
</head>
<body>
  <section id="qr-code">
    <div class="container">
      <div class="row">
          <img src="image-qr-code.png" alt="QR Code" class="qr__img">
          <div class="qr__para">
            <h1 class="qr__title">Improve your front-end skills by building projects</h1>
            <p class="qr__description">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
